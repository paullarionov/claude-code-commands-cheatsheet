<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg:           #FAF8F5;
    --surface:      #FFFFFF;
    --border:       #EDE6DC;
    --border-faint: #F4EFE8;
    --text:         #1C1917;
    --text-2:       #7C6F65;
    --text-3:       #B0A499;
    --accent:       #C96442;
    --key-bg:       #F2EBE1;
    --key-border:   #E3D6C8;
  }

  body.night-theme {
    --bg:           #1A1A1A;
    --surface:      #252525;
    --border:       #3A3A3A;
    --border-faint: #2A2A2A;
    --text:         #E5E5E5;
    --text-2:       #B8B8B8;
    --text-3:       #808080;
    --accent:       #E8956D;
    --key-bg:       #333333;
    --key-border:   #4A4A4A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: Inter, -apple-system, system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ─────────────────────────────────── */
  header {
    text-align: center;
    padding: 28px 24px 18px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 28px;
  }

  header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.6px;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  header p {
    font-size: 13px;
    color: var(--text-2);
    max-width: 640px;
    margin: 0 auto;
  }

  .back-link {
    display: inline-block;
    margin-bottom: 24px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
    font-size: 11px;
    transition: color 0.18s;
  }

  .back-link:hover {
    color: var(--text);
  }

  /* ── Main Content ────────────────────────────── */
  main {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px 40px;
  }

  article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
  }

  h2 {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-top: 32px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--border-faint);
  }

  h2:first-child {
    margin-top: 0;
  }

  h3 {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-top: 24px;
    margin-bottom: 12px;
  }

  p {
    margin-bottom: 14px;
    color: var(--text);
    line-height: 1.7;
  }

  ul, ol {
    margin: 16px 0 16px 20px;
    color: var(--text);
  }

  li {
    margin-bottom: 8px;
    line-height: 1.7;
  }

  code {
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 11px;
    font-family: 'Monaco', 'Courier New', monospace;
    color: var(--accent);
  }

  .tip {
    background: rgba(201, 100, 66, 0.1);
    border-left: 3px solid var(--accent);
    padding: 16px;
    margin: 20px 0;
    border-radius: 4px;
    font-size: 12px;
  }

  a {
    color: var(--accent);
    text-decoration: none;
    transition: color 0.18s;
  }

  a:hover {
    color: var(--text);
  }

  footer {
    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid var(--border);
    margin-top: 60px;
    font-size: 11px;
    color: var(--text-3);
  }

  @media (max-width: 640px) {
    article { padding: 20px; }
    h2 { font-size: 18px; }
    h3 { font-size: 14px; }
    header h1 { font-size: 20px; line-height: 1.3; }
  }

  /* ── Navigation ──────────────────────────────── */













  header {
    margin-top: 80px;
  }

  });
