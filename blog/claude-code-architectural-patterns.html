      <h2>8. Configuration & Settings</h2>

      <h3>Hierarchical Settings in .claude/settings.json</h3>
      <p>Configure Claude Code behavior globally or per-project:</p>
      <ul>
        <li><strong>Permissions:</strong> Which operations require approval</li>
        <li><strong>Model Config:</strong> Default model, temperature, max tokens</li>
        <li><strong>Output Styles:</strong> Formatting, colors, verbosity</li>
        <li><strong>Keyboard Bindings:</strong> Custom shortcuts for frequent actions</li>
        <li><strong>Auto-Behaviors:</strong> Hooks that run before/after operations</li>
      </ul>

      <h2>9. Pro Tips for Production Excellence</h2>

      <h3>Tip 1: Simplify Code Quality with /simplify</h3>
      <p>Review changed code for reuse, quality, and efficiency, then fix issues automatically. Use this after implementing features to ensure clean, maintainable code.</p>

      <h3>Tip 2: Batch Operations with /batch</h3>
      <p>Apply the same transformation across multiple files. Great for refactoring variable names, updating imports, or applying consistent formatting.</p>

      <h3>Tip 3: Checkpointing for Safety</h3>
      <p>Use <code>/rewind</code> or press <code>Esc Esc</code> to track and rewind file edits automatically. This gives you a safety net for exploratory changes without committing them.</p>

      <h3>Tip 4: Voice Dictation</h3>
      <p>Enable voice input with <code>/voice</code>. Supports 20+ languages and rebindable keys for hands-free control during complex problem-solving sessions.</p>

      <h3>Tip 5: Strategic Model Selection</h3>
      <p>Different models have different costs and capabilities:</p>
      <ul>
        <li><strong>Haiku:</strong> Fast, lightweight work (queries, summaries, simple edits)</li>
        <li><strong>Sonnet:</strong> General-purpose (coding, analysis, detailed writing)</li>
        <li><strong>Opus:</strong> Deep reasoning required (complex architecture, novel problems)</li>
      </ul>
      <p>Switch models deliberately at the start of sessions to optimize for cost vs. capability.</p>
