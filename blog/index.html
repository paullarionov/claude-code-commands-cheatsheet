<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  :root {
    --bg: #FAF8F5; --surface: #FFFFFF; --border: #EDE6DC; --border-faint: #F4EFE8;
    --text: #1C1917; --text-2: #7C6F65; --text-3: #B0A499; --accent: #C96442;
    --key-bg: #F2EBE1; --key-border: #E3D6C8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    font-size: 12px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  header.page-header {
    text-align: center;
    padding: 32px 24px 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
    margin-top: 100px;
  }
  header.page-header h1 {
    font-size: 32px; font-weight: 700;
    letter-spacing: -0.6px; color: var(--text);
    line-height: 1.15; margin-bottom: 12px;
  }
  header.page-header p {
    font-size: 14px; color: var(--text-2);
    max-width: 640px; margin: 0 auto;
  }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  .post-list {
    display: grid;
    gap: 16px;
  }

  h2.section-divider {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin: 32px 0 4px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .post-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    transition: border-color 0.18s, transform 0.18s;
  }

  .post-card:hover {
    border-color: var(--accent);
    transform: translateY(-1px);
  }

  .post-card a.post-title-link {
    color: var(--text);
    text-decoration: none;
  }

  .post-card h2 {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.2px;
  }

  .post-card:hover h2 { color: var(--accent); }

  .post-card p.excerpt {
    color: var(--text-2);
    margin-bottom: 12px;
    font-size: 12.5px;
    line-height: 1.6;
  }

  .post-meta {
    font-size: 11px;
    color: var(--text-3);
  }

  .post-meta span + span::before { content: " · "; }

  .tag {
    display: inline-block;
    background: var(--key-bg);
    border: 1px solid var(--key-border);
    border-radius: 999px;
    padding: 2px 10px;
    margin-right: 6px;
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-2);
  }

  footer {
    text-align: center;
    padding: 24px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
    font-size: 11px;
    color: var(--text-2);
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* Navbar */
  .navbar { position: fixed; top: 0; left: 0; right: 0; background: var(--surface); border-bottom: 1px solid var(--accent); z-index: 1000; }
  .nav-container { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; }
  .logo { font-weight: 600; color: var(--text); text-decoration: none; margin-right: 40px; display: flex; align-items: center; gap: 8px; }
  .logo-img { height: 24px; width: 24px; }
  .nav-menu { list-style: none; display: flex; gap: 30px; margin: 0; padding: 0; align-items: center; }
  .nav-menu a { color: var(--text); text-decoration: none; font-weight: 500; transition: color 0.2s; }
  .nav-menu a:hover { color: var(--accent); }
  .dropdown { position: relative; }
  .dropdown-toggle { cursor: pointer; }
  .dropdown-menu { display: none; position: absolute; top: 100%; left: 0; background: var(--surface); border: 1px solid var(--accent); border-radius: 4px; list-style: none; margin: 8px 0 0 0; padding: 8px 0; min-width: 200px; }
  .dropdown:hover .dropdown-menu { display: block; }
  .dropdown-menu li a { display: block; padding: 8px 16px; color: var(--text); }
  .dropdown-menu li a:hover { background: rgba(201, 100, 66, 0.1); color: var(--accent); }
  body > header, body > main { padding-top: 50px; }

  .controls {
    display: flex;
    gap: 16px;
    margin-bottom: 32px;
    flex-wrap: wrap;
    align-items: center;
  }

  .control-group {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .control-group label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-2);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .control-group select, .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text);
    cursor: pointer;
    transition: border-color 0.2s, background-color 0.2s;
  }

  .control-group select:hover, .filter-btn:hover {
    border-color: var(--accent);
  }

  .filter-btn {
    padding: 4px 10px;
    white-space: nowrap;
  }

  .filter-btn.active {
    background: var(--accent);
    color: var(--surface);
    border-color: var(--accent);
  }

  .filter-tags {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .clear-filters {
    font-size: 11px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    transition: opacity 0.2s;
  }

  .clear-filters:hover {
    opacity: 0.7;
  }

  .results-count {
    font-size: 11px;
    color: var(--text-2);
    margin-top: 8px;
  }

  @media (max-width: 768px) {
    .nav-menu { gap: 15px; }
    .logo { margin-right: 20px; font-size: 14px; }
    .nav-container { padding: 10px 16px; }
    header.page-header h1 { font-size: 26px; }
    .controls { flex-direction: column; align-items: stretch; }
    .control-group { flex-direction: column; align-items: stretch; }
    .control-group select { width: 100%; }
  }
</style>
</head>

<header class="page-header">
  <h1>The Claude Guides Blog</h1>
  <p>Practical guides, field reports, and research for people building with Claude Code, AI agents, and LLM tooling.</p>
</header>

<main>
<div class="controls">
  <div class="control-group">
    <label for="category-select">Category</label>
    <select id="category-select">
      <option value="">All Categories</option>
    </select>
  </div>
  <div class="control-group">
    <label for="sort-select">Sort</label>
    <select id="sort-select">
      <option value="date-desc">Newest first</option>
      <option value="date-asc">Oldest first</option>
      <option value="title">Title (A-Z)</option>
    </select>
  </div>
</div>

<div id="filter-tags" class="filter-tags"></div>
<div id="clear-filters" class="clear-filters" style="display:none;">Clear filters</div>
<div class="results-count" id="results-count"></div>
<div class="post-list" id="post-list"></div>

<footer>
  <p>&copy; 2026 Claude Guides. <a href="/">Back to cheatsheet</a></p>
</footer>

<script src="/js/navbar-loader.js"></script>
<script>
let posts = [];
let selectedTags = [];
let selectedCategory = '';

const postList = document.getElementById('post-list');
const sortSelect = document.getElementById('sort-select');
const categorySelect = document.getElementById('category-select');
const filterTagsContainer = document.getElementById('filter-tags');
const clearFiltersBtn = document.getElementById('clear-filters');
const resultsCount = document.getElementById('results-count');

async function loadPosts() {
  try {
    const response = await fetch('/blog/blog-posts.json');
    const data = await response.json();
    posts = data.posts;
    initializeFilters();
    renderPosts();
  } catch (error) {
    console.error('Error loading posts:', error);
    postList.innerHTML = '<p>Error loading blog posts.</p>';
  }
}

function getCategories() {
  const categories = new Set();
  posts.forEach(post => categories.add(post.category));
  return Array.from(categories).sort();
}

function getAllTags() {
  const tags = new Set();
  posts.forEach(post => post.tags.forEach(tag => tags.add(tag)));
  return Array.from(tags).sort();
}

function initializeFilters() {
  const categories = getCategories();
  categorySelect.innerHTML = '<option value="">All Categories</option>' +
    categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');

  renderFilterButtons();
}

function renderFilterButtons() {
  const tags = getAllTags();
  filterTagsContainer.innerHTML = tags.map(tag =>
    `<button class="filter-btn" data-tag="${tag}">${tag}</button>`
  ).join('');

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const tag = btn.dataset.tag;
      if (selectedTags.includes(tag)) {
        selectedTags = selectedTags.filter(t => t !== tag);
      } else {
        selectedTags.push(tag);
      }
      renderPosts();
      updateFilterButtons();
    });
  });
}

function updateFilterButtons() {
  document.querySelectorAll('.filter-btn').forEach(btn => {
    const tag = btn.dataset.tag;
    btn.classList.toggle('active', selectedTags.includes(tag));
  });
  clearFiltersBtn.style.display = (selectedTags.length > 0 || selectedCategory) ? 'inline' : 'none';
}

function sortPosts(postsToSort) {
  const sortValue = sortSelect.value;
  const sorted = [...postsToSort];

  switch(sortValue) {
    case 'date-asc':
      return sorted.sort((a, b) => new Date(a.date) - new Date(b.date));
    case 'title':
      return sorted.sort((a, b) => a.title.localeCompare(b.title));
    default:
      return sorted.sort((a, b) => new Date(b.date) - new Date(a.date));
  }
}

function renderPosts() {
  let filtered = posts;

  if (selectedCategory) {
    filtered = filtered.filter(post => post.category === selectedCategory);
  }

  if (selectedTags.length > 0) {
    filtered = filtered.filter(post =>
      selectedTags.some(tag => post.tags.includes(tag))
    );
  }

  const sorted = sortPosts(filtered);

  postList.innerHTML = sorted.map(post => {
    const readTimeText = post.readTime ? `<span>${post.readTime} min read</span>` : '';
    const categoryText = `<span>${post.category}</span>`;
    return `
      <article class="post-card">
        <a href="${post.url}" class="post-title-link"><h2>${post.title}</h2></a>
        <p class="excerpt">${post.excerpt}</p>
        <div class="post-meta">${readTimeText}${readTimeText ? categoryText : `${categoryText}`}</div>
        ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
      </article>
    `;
  }).join('');

  resultsCount.textContent = `${sorted.length} post${sorted.length !== 1 ? 's' : ''}`;
}

sortSelect.addEventListener('change', renderPosts);

categorySelect.addEventListener('change', (e) => {
  selectedCategory = e.target.value;
  renderPosts();
  updateFilterButtons();
});

clearFiltersBtn.addEventListener('click', () => {
  selectedTags = [];
  selectedCategory = '';
  categorySelect.value = '';
  renderPosts();
  updateFilterButtons();
});

loadPosts();
</script>
