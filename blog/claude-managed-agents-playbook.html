<p>Outputs land in <code>/mnt/session/outputs/</code>. Pull them via the Files API once the session reports <code>satisfied</code>.</p>

<h2>Multiagent delegation</h2>

<p>A coordinator agent can call other agents listed in its <code>callable_agents</code>. Each runs in its own thread with isolated context, but they share one container and filesystem. Useful for code review with read-only tools, test generation in a sandboxed agent, or research agents with web access.</p>

<p>One limit: delegation is one level deep. The coordinator calls sub-agents; sub-agents can't chain further. Design accordingly.</p>

<h2>Architecture in one paragraph</h2>

<p>Anthropic deliberately split the system into three replaceable pieces: the <strong>brain</strong> (Claude plus harness), the <strong>hands</strong> (sandboxes and tools), and the <strong>session</strong> (an event log). Each is an interface with minimal assumptions about the others. A failure in one doesn't kill the system, execution is isolated from context, and you can plug in new harnesses as they evolve. Prompt caching, compaction, and automatic recovery are all built in.</p>

<h2>Cost and limits</h2>

<p>Standard API token rates plus <strong>$0.08 per active session hour</strong>. A ten-minute coding session costs a few cents in compute on top of tokens. API rate limits: 60 writes/min for resource creation, 600 reads/min for gets, lists, and streaming. Your org and plan limits stack on top.</p>

<h2>Launch checklist</h2>

<ol>
  <li>Get an API key at console.anthropic.com</li>
  <li>Install the CLI or SDK</li>
  <li>Export <code>ANTHROPIC_API_KEY</code></li>
  <li>Create an agent (model + prompt + tools)</li>
  <li>Create an environment (container + packages + networking)</li>
  <li>Start a session and send a task</li>
  <li>Handle the event stream in your app</li>
</ol>

<h2>The bottom line</h2>

<p>Managed Agents is the shortest path from "we want an agent" to "it's running in production." If your infrastructure is the blocker, switch. If you need a custom harness and total control, stay on Messages. Either way, the cost of hand-building a sandbox and event log just went to zero as a default choice.</p>
